baseURL = 'https://clawsouls.github.io/blog/'
title = 'ClawSouls Blog'
theme = 'PaperMod'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[pagination]
  pagerSize = 10

[languages]
  [languages.en]
    languageCode = 'en'
    languageName = 'English'
    weight = 1
    [languages.en.params]
      description = 'AI Persona Spec for Any Agent Framework — Engineering insights, guides, and updates from ClawSouls.'
      [languages.en.params.homeInfoParams]
        Title = 'ClawSouls Blog'
        Content = '''
Building the open spec for AI personas.

Soul Spec works with **OpenClaw**, **ZeroClaw**, **Clawdbot**, **Moltbot**, **Moldbot**, and any SOUL.md-compatible agent framework.

[Browse Souls →](https://clawsouls.ai) · [GitHub →](https://github.com/clawsouls) · [SoulScan →](https://clawsouls.ai/soulscan)
'''
    [[languages.en.menu.main]]
      name = 'Posts'
      url = '/posts/'
      weight = 1
    [[languages.en.menu.main]]
      name = 'Guides'
      url = '/guides/'
      weight = 2
    [[languages.en.menu.main]]
      name = 'Tags'
      url = '/tags/'
      weight = 3
    [[languages.en.menu.main]]
      name = 'ClawSouls.ai'
      url = 'https://clawsouls.ai'
      weight = 4

  [languages.ko]
    languageCode = 'ko'
    languageName = '한국어'
    weight = 2
    [languages.ko.params]
      description = 'AI 페르소나 오픈 스펙 — ClawSouls 엔지니어링 인사이트, 가이드, 업데이트.'
      [languages.ko.params.homeInfoParams]
        Title = 'ClawSouls 블로그'
        Content = '''
AI 페르소나를 위한 오픈 스펙을 만들고 있습니다.

Soul Spec은 **OpenClaw**, **ZeroClaw**, **Clawdbot**, **Moltbot**, **Moldbot** 등 모든 SOUL.md 호환 에이전트 프레임워크에서 동작합니다.

[Soul 둘러보기 →](https://clawsouls.ai) · [GitHub →](https://github.com/clawsouls) · [SoulScan →](https://clawsouls.ai/soulscan)
'''
    [[languages.ko.menu.main]]
      name = '포스트'
      url = 'https://clawsouls.github.io/blog/ko/posts/'
      weight = 1
    [[languages.ko.menu.main]]
      name = '가이드'
      url = 'https://clawsouls.github.io/blog/ko/guides/'
      weight = 2
    [[languages.ko.menu.main]]
      name = '태그'
      url = 'https://clawsouls.github.io/blog/ko/tags/'
      weight = 3
    [[languages.ko.menu.main]]
      name = 'ClawSouls.ai'
      url = 'https://clawsouls.ai'
      weight = 4

[params]
  env = 'production'
  author = 'Tom Lee'
  defaultTheme = 'dark'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/clawsouls'
  [[params.socialIcons]]
    name = 'x'
    url = 'https://x.com/ClawSoulsAI'

[markup]
  [markup.highlight]
    style = 'dracula'
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  tag = 'tags'
  category = 'categories'
