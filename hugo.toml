baseURL = 'https://blog.clawsouls.ai/'
languageCode = 'en'
title = 'ClawSouls Blog'
theme = 'PaperMod'

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  description = 'AI Persona Spec for Any Agent Framework — Engineering insights, guides, and updates from ClawSouls.'
  author = 'Tom Lee'
  defaultTheme = 'dark'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  [params.homeInfoParams]
    Title = 'ClawSouls Blog'
    Content = '''
Building the open spec for AI personas.

Soul Spec works with **OpenClaw**, **ZeroClaw**, **Clawdbot**, **Moltbot**, **Moldbot**, and any SOUL.md-compatible agent framework.

[Browse Souls →](https://clawsouls.ai) · [GitHub →](https://github.com/clawsouls) · [SoulScan →](https://clawsouls.ai/soulscan)
'''

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/clawsouls'
  [[params.socialIcons]]
    name = 'x'
    url = 'https://x.com/ClawSoulsAI'

[menu]
  [[menu.main]]
    name = 'Posts'
    url = '/posts/'
    weight = 1
  [[menu.main]]
    name = 'Guides'
    url = '/guides/'
    weight = 2
  [[menu.main]]
    name = 'Tags'
    url = '/tags/'
    weight = 3
  [[menu.main]]
    name = 'ClawSouls.ai'
    url = 'https://clawsouls.ai'
    weight = 4

[markup]
  [markup.highlight]
    style = 'dracula'
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  tag = 'tags'
  category = 'categories'
